[project]
name = "amle-transformers-llms"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
]

# PyTorch publishes a CPU-only build on its own index. Without this the default
# wheel pulls in the NVIDIA CUDA runtime, several gigabytes of it, for machines
# that have no GPU to use it.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
